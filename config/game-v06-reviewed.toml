# Exact-ROM-reviewed milestone-06 NESRecomp configuration.
#
# This deliberately disables heuristic pointer and secondary discovery. Only
# vector-reachable control flow, the reviewed MMC1 bank-switch routine, and
# explicitly proved entries are admitted. It is a conservative program-map
# experiment, not yet a complete production-core configuration.

[game]
output_prefix = "mm2_reviewed_v06"
disable_ptr_scan = true
disable_secondary = true

[mapper]
bank_switch = [0xC000]

[functions]
fixed = [0xFFE0, 0xCFF0]
bank12 = [0x8000]
bank14 = [0x8000]

# Exact split-pointer contracts. `adjust = 0` because these tables contain
# executable entry addresses, not RTS-minus-one stack return addresses.
[[known_split_table]]
bank = 11
lo_addr = 0x8047
hi_addr = 0x8055
count = 14
stride = 1
adjust = 0

